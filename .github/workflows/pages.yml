name: Deploy site to GitHub Pages

# The playground's WebAssembly module is built here rather than committed,
# so site/rigid.wasm can never be stale relative to src/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Build the playground module
        run: ./build-wasm.sh

      - name: Check the generated doc pages are current
        # rigid.wasm is excluded: it was just rebuilt by the step above, and a
        # different rustc produces different bytes for identical source, so
        # comparing it here would fail every build for no reason. The HTML is
        # what has to match, because that is what goes stale when a doc is
        # edited without regenerating.
        run: |
          python3 site/build.py
          if ! git diff --quiet -- site ':!site/rigid.wasm'; then
            echo "site/ is out of date — run 'python3 site/build.py' and commit."
            git --no-pager diff --stat -- site ':!site/rigid.wasm'
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
